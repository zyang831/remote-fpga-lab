<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1560 640" width="1560" height="640" font-family="Inter, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif">
  <title>The booth reaches the lab board over the network</title>
  <defs>
    <g id="board">
      <rect x="0" y="0" width="220" height="140" rx="10" fill="#1d6b57" stroke="#0f4536" stroke-width="2"/>
      <circle cx="10" cy="10" r="4" fill="#0f4536"/><circle cx="210" cy="10" r="4" fill="#0f4536"/>
      <circle cx="10" cy="130" r="4" fill="#0f4536"/><circle cx="210" cy="130" r="4" fill="#0f4536"/>
      <rect x="75" y="30" width="70" height="70" rx="5" fill="#22262b" stroke="#51575e" stroke-width="2"/>
      <text x="110" y="62" fill="#e8ecef" font-size="11" font-weight="700" text-anchor="middle">AGILEX 5</text>
      <text x="110" y="78" fill="#9aa3ab" font-size="9" text-anchor="middle">FPGA + ARM</text>
      <text x="16" y="126" fill="#cfe9df" font-size="12" font-weight="600">DE25-Nano</text>
      <g fill="#ffd23f"><circle cx="160" cy="120" r="4"/><circle cx="172" cy="120" r="4"/><circle cx="184" cy="120" r="4" fill="#6b5d1f"/><circle cx="196" cy="120" r="4"/></g>
      <rect x="-14" y="20" width="16" height="22" rx="3" fill="#2d3136"/>
      <rect x="206" y="25" width="20" height="14" rx="2" fill="#c9ccd1" stroke="#8a9096"/>
      <rect x="206" y="57" width="22" height="24" rx="2" fill="#c9ccd1" stroke="#8a9096"/>
      <rect x="30" y="-6" width="50" height="10" rx="2" fill="#f5f0e1" stroke="#b9a77a"/>
    </g>
    <g id="person">
      <circle cx="0" cy="-26" r="15"/><path d="M-26 20 C -26 -6, 26 -6, 26 20 Z"/>
    </g>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5e6ad2"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f9e5b"/></marker>
  </defs>

  <rect width="1560" height="640" fill="#f6f7f9"/>
  <text x="780" y="46" font-size="28" font-weight="700" fill="#1b1f24" text-anchor="middle">The board stays in the lab. The booth reaches it like a remote student.</text>

  <!-- network cloud (behind the arrows) -->
  <path d="M640 360 C 590 360, 585 290, 640 285 C 640 230, 720 215, 750 255 C 780 205, 870 215, 870 270 C 930 265, 945 350, 885 360 Z" fill="#e8eaf6" stroke="#c5cae9" stroke-width="2"/>
  <text x="765" y="300" font-size="18" font-weight="700" fill="#3949ab" text-anchor="middle">Internet</text>
  <text x="765" y="324" font-size="14" fill="#5c6bc0" text-anchor="middle">Tailscale private network</text>

  <!-- arrows -->
  <path d="M520 220 C 620 190, 900 190, 1030 220" stroke="#5e6ad2" stroke-width="7" fill="none" marker-end="url(#ah-blue)"/>
  <text x="775" y="176" font-size="16" font-weight="700" fill="#5e6ad2" text-anchor="middle">clicks, bitstreams, models</text>
  <path d="M1030 420 C 900 450, 620 450, 520 420" stroke="#2f9e5b" stroke-width="7" fill="none" marker-end="url(#ah-green)"/>
  <text x="775" y="478" font-size="16" font-weight="700" fill="#2f9e5b" text-anchor="middle">live camera + answers (~9 per second)</text>

  <!-- ============ Booth ============ -->
  <g transform="translate(20,80)">
    <rect width="500" height="480" rx="16" fill="#fff" stroke="#e1e4e8" stroke-width="2"/>
    <text x="24" y="44" font-size="22" font-weight="700" fill="#1b1f24">At the booth</text>
    <text x="24" y="68" font-size="14" fill="#6b7178">only a laptop on the tailnet</text>

    <!-- laptop showing the web UI -->
    <rect x="100" y="96" width="300" height="186" rx="12" fill="#2d3136"/>
    <rect x="112" y="108" width="276" height="162" rx="4" fill="#0e0e10"/>
    <rect x="112" y="108" width="276" height="18" fill="#18181b"/>
    <text x="120" y="121" font-size="9" fill="#a1a1aa">FPGA Remote Lab</text>
    <rect x="124" y="136" width="120" height="120" rx="4" fill="#1b1f24"/>
    <circle cx="184" cy="202" r="34" fill="#d64545"/><path d="M184 168 C 186 160, 190 156, 194 154" stroke="#6b4a2b" stroke-width="3" fill="none"/>
    <ellipse cx="200" cy="162" rx="10" ry="5" fill="#4ade80" transform="rotate(-25 200 162)"/>
    <circle cx="172" cy="190" r="7" fill="#fff" opacity=".35"/>
    <rect x="130" y="142" width="36" height="12" rx="2" fill="#18181b"/><circle cx="136" cy="148" r="2.5" fill="#f87171"/><text x="142" y="151" font-size="7" fill="#fafafa">LIVE</text>
    <text x="256" y="156" font-size="9" fill="#a1a1aa">BOARD SAYS</text>
    <text x="256" y="186" font-size="26" font-weight="700" fill="#4ade80">apple</text>
    <rect x="256" y="198" width="118" height="6" rx="3" fill="#27272a"/><rect x="256" y="198" width="104" height="6" rx="3" fill="#5e6ad2"/>
    <text x="256" y="232" font-size="9" fill="#a1a1aa">INFERENCE ON FPGA</text>
    <text x="256" y="250" font-size="16" font-weight="700" fill="#fafafa">~97 ms</text>
    <path d="M78 282 H422 L440 300 H60 Z" fill="#c9ccd1"/>
    <text x="250" y="330" font-size="15" font-weight="600" fill="#1b1f24" text-anchor="middle">Presenter laptop</text>

    <!-- audience -->
    <g fill="#c5cae9"><use xlink:href="#person" x="110" y="420"/><use xlink:href="#person" x="180" y="428"/></g>
    <g fill="#b2dfdb"><use xlink:href="#person" x="250" y="420"/></g>
    <g fill="#ffe0b2"><use xlink:href="#person" x="320" y="428"/><use xlink:href="#person" x="390" y="420"/></g>
  </g>

  <!-- ============ Lab ============ -->
  <g transform="translate(1040,80)">
    <rect width="500" height="480" rx="16" fill="#fff" stroke="#e1e4e8" stroke-width="2"/>
    <text x="24" y="44" font-size="22" font-weight="700" fill="#1b1f24">In the lab</text>
    <text x="24" y="68" font-size="14" fill="#6b7178">runs by itself, nobody needs to be there</text>

    <!-- monitor with the slideshow -->
    <rect x="30" y="92" width="200" height="130" rx="8" fill="#2d3136"/>
    <rect x="40" y="102" width="180" height="110" rx="3" fill="#fff8e1"/>
    <path d="M70 150 Q 130 205 196 132 Q 186 128 180 134 Q 130 180 78 144 Z" fill="#f4d03f" stroke="#c9a227" stroke-width="2"/>
    <path d="M196 132 l6 -6" stroke="#6b4a2b" stroke-width="4" stroke-linecap="round"/>
    <rect x="120" y="222" width="20" height="16" fill="#3a3f45"/><rect x="95" y="238" width="70" height="8" rx="3" fill="#3a3f45"/>
    <text x="130" y="266" font-size="14" font-weight="600" fill="#1b1f24" text-anchor="middle">Slideshow monitor</text>

    <!-- lab PC -->
    <rect x="395" y="96" width="60" height="120" rx="7" fill="#3a3f45"/><rect x="405" y="110" width="40" height="6" rx="2" fill="#6b7178"/>
    <rect x="405" y="122" width="40" height="6" rx="2" fill="#6b7178"/><circle cx="425" cy="198" r="5" fill="#4ade80"/>
    <text x="385" y="180" font-size="14" font-weight="600" fill="#1b1f24" text-anchor="end">Lab PC</text>
    <text x="385" y="198" font-size="12" fill="#6b7178" text-anchor="end">web app + Mender</text>
    <path d="M230 130 H395" stroke="#8a9096" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"/>

    <!-- MIPI camera looking at the monitor -->
    <polygon points="150,300 170,300 222,214 42,214" fill="#3b7dd8" opacity=".12"/>
    <rect x="152" y="300" width="36" height="36" rx="5" fill="#2d3136"/><circle cx="170" cy="318" r="10" fill="#3b7dd8"/>
    <rect x="163" y="336" width="14" height="14" fill="#f2a541"/>

    <!-- board, power, ethernet, webcam -->
    <path d="M60 438 C 80 438, 90 372, 108 372" stroke="#e4572e" stroke-width="5" fill="none" stroke-linecap="round"/>
    <rect x="22" y="420" width="48" height="32" rx="6" fill="#3a3f45"/><path d="M50 425 L41 438 H48 L44 448 L55 434 H48 Z" fill="#ffd23f"/>
    <path d="M302 405 C 400 405, 440 380, 440 216" stroke="#2b7bb9" stroke-width="6" fill="none" stroke-linecap="round"/>
    <text x="420" y="330" font-size="13" font-weight="600" fill="#2b7bb9" text-anchor="end">Ethernet</text>
    <path d="M298 370 C 330 370, 350 320, 350 312" stroke="#7b4bb7" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="350" cy="296" r="16" fill="#2d3136"/><circle cx="350" cy="296" r="8" fill="#3b7dd8"/>
    <text x="350" y="272" font-size="12" fill="#6b7178" text-anchor="middle">webcam</text>
    <use xlink:href="#board" transform="translate(120,350) scale(.8)"/>
  </g>

  <text x="780" y="610" font-size="16" fill="#3a3f45" text-anchor="middle">Every button press travels to the lab. Every answer is computed on the FPGA there.</text>
</svg>
